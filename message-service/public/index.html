<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini Chat</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      input,
      button {
        padding: 0.4rem 0.6rem;
        font-size: 1rem;
      }
      #log {
        border: 1px solid #ccc;
        height: 320px;
        overflow-y: auto;
        padding: 0.5rem;
        margin: 0.75rem 0;
      }
      .msg b {
        color: #2a5bd7;
      }
      .msg small {
        color: #888;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .row input {
        flex: 1;
      }
      #err {
        color: #b00020;
        min-height: 1.2em;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Mini Chat</h1>

    <div id="auth">
      <div class="row">
        <input
          id="u"
          placeholder="username (3-32: a-z, 0-9, _ -)"
          autocomplete="username"
          maxlength="32"
        />
        <input
          id="p"
          type="password"
          placeholder="password (6+ characters)"
          autocomplete="current-password"
          maxlength="72"
        />
      </div>
      <div class="row">
        <button id="login">Log in</button>
        <button id="register">Register</button>
      </div>
    </div>

    <div id="chat" class="hidden">
      <p>Logged in as <b id="me"></b> <button id="logout">Log out</button></p>
      <div class="row"><input id="room" value="general" placeholder="room" maxlength="32" /></div>
      <div id="log"></div>
      <div class="row">
        <input id="text" placeholder="message" maxlength="500" />
        <button id="send">Send</button>
      </div>
    </div>

    <div id="err"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      let token = null;
      let timer = null;

      const showErr = (m) => {
        $('err').textContent = m || '';
      };

      async function api(path, opts = {}) {
        const r = await fetch(path, {
          ...opts,
          headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        });
        const body = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
        return body;
      }

      async function login() {
        showErr();
        try {
          const body = await api('/login', {
            method: 'POST',
            body: JSON.stringify({ username: $('u').value, password: $('p').value }),
          });
          token = body.token;
          $('me').textContent = body.username;
          $('auth').classList.add('hidden');
          $('chat').classList.remove('hidden');
          refresh();
          timer = setInterval(refresh, 3000);
        } catch (e) {
          showErr(e.message);
        }
      }

      async function register() {
        showErr();
        try {
          await api('/register', {
            method: 'POST',
            body: JSON.stringify({ username: $('u').value, password: $('p').value }),
          });
          await login();
        } catch (e) {
          showErr(e.message);
        }
      }

      function logout() {
        token = null;
        clearInterval(timer);
        $('chat').classList.add('hidden');
        $('auth').classList.remove('hidden');
      }

      async function refresh() {
        try {
          const msgs = await api(`/messages/${encodeURIComponent($('room').value)}`);
          const log = $('log');
          log.replaceChildren(
            ...msgs.map((m) => {
              const d = document.createElement('div');
              d.className = 'msg';
              const b = document.createElement('b');
              b.textContent = m.user;
              const s = document.createElement('small');
              s.textContent = ' ' + new Date(m.ts).toLocaleTimeString();
              d.append(b, s, ': ' + m.text);
              return d;
            }),
          );
          log.scrollTop = log.scrollHeight;
        } catch (e) {
          showErr(e.message);
        }
      }

      async function send() {
        const text = $('text').value.trim();
        if (!text) return;
        showErr();
        try {
          await api('/messages', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
            body: JSON.stringify({ room: $('room').value, text }),
          });
          $('text').value = '';
          refresh();
        } catch (e) {
          showErr(e.message);
        }
      }

      $('login').onclick = login;
      $('register').onclick = register;
      $('logout').onclick = logout;
      $('send').onclick = send;
      $('text').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') send();
      });
      $('room').addEventListener('change', refresh);
    </script>
  </body>
</html>
